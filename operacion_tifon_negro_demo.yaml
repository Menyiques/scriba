metadata:
  title: DAS BOOT - DEMO
  author: Sergio Morales (Menyiques)
  version: 1.0-demo
  language: es
  start_location: '@playa'
  max_score: 10
  start_message: 'DAS BOOT  ---  VERSION DEMO

    Francia ocupada - 14 de septiembre de 1943 - 03:00 horas


    Eres el Capitan James Fletcher, agente del SOE britanico. Acabas de desembarcar
    cerca de Saint-Corentin. Tu contacto de la Resistance, Marguerite, te espera en
    la trastienda de la taberna del pueblo... pero llegar hasta ella no sera facil.


    OBJETIVO DE LA DEMO: encuentra el modo de bajar a la trastienda y reunete con
    Marguerite.


    (Esta es una demostracion gratuita. La aventura completa continua tras este encuentro.)'
