condacts:
  on_start: REM El Faro - aventura de ejemplo de Scriba. Sin temporizadores.
  responses: |-
    REM ===========================================================
    REM  EL FARO - logica del juego
    REM ===========================================================

    ON AYUDA _ _
      PRINT "------------------------------------------"
      PRINT "COMANDOS"
      PRINT "  Mover: NORTE  SUR  (N / S)"
      PRINT "  EXAMINAR cosa     CAVAR arena"
      PRINT "  COGER cosa        ABRIR puerta"
      PRINT "  METER pilas       ENCENDER linterna"
      PRINT "  ENCENDER lampara  INVENTARIO (I)"
      PRINT "  PUNTUACION        SALIDAS"
      PRINT "  ACABAR (abandonar la partida)"
      PRINT "------------------------------------------"
      MATCH
    ENDON

    ON PUNT _ _
      SCORE
      MATCH
    ENDON

    REM -- Paso 1: descubrir la llave cavando/examinando la arena --
    ON CAVAR ARENA
      IF AT @playa THEN
        IF _ARENA_CAVADA = 0 THEN
          LET _ARENA_CAVADA = 1
          CREATE #llave @playa
          PRINT "Escarbas en la arena fria y tus dedos rozan algo metalico:"
          PRINT "una llave oxidada queda al descubierto."
          ADDSCORE 3
        ELSE
          PRINT "Solo queda arena revuelta."
        ENDIF
        MATCH
      ENDIF
    ENDON

    ON EXAMI ARENA
      IF AT @playa THEN
        IF _ARENA_CAVADA = 0 THEN
          PRINT "La arena esta removida por el temporal. Algo asoma a medias; tendrias que CAVAR para sacarlo."
        ELSE
          PRINT "Solo queda arena revuelta."
        ENDIF
        MATCH
      ENDIF
    ENDON

    REM -- Paso 2: abrir la puerta del faro con la llave --
    ON ABRIR PUERT
      IF AT @sendero THEN
        IF _PUERTA_ABIERTA = 1 THEN
          PRINT "La puerta del faro ya esta abierta."
        ELSE
          IF CARRIED #llave THEN
            LET _PUERTA_ABIERTA = 1
            PRINT "La llave gira con un chirrido oxidado y la puerta de hierro cede."
            PRINT "El camino hacia el interior del faro queda libre al NORTE."
            ADDSCORE 3
          ELSE
            PRINT "La puerta de hierro esta cerrada a cal y canto. Hara falta una llave."
          ENDIF
        ENDIF
        MATCH
      ENDIF
    ENDON

    REM -- La puerta cerrada bloquea el paso al norte (hacia el faro) --
    ON N _ _
      IF AT @sendero THEN
        IF _PUERTA_ABIERTA = 0 THEN
          PRINT "La puerta de hierro, cerrada, te corta el paso hacia el faro."
          MATCH
        ENDIF
      ENDIF
    ENDON

    REM -- Paso 2b: pilas + linterna (puzle con variables) --
    ON METER PILAS LINTE
      IF _PILAS_PUESTAS THEN
        PRINT "La linterna ya tiene las pilas puestas."
        MATCH
      ENDIF
      IF #pilas.carried AND #linterna.carried THEN
        LET _PILAS_PUESTAS = 1
        DESTROY #pilas
        PRINT "Abres la tapa de la linterna y encajas las pilas. Un clic."
        ADDSCORE 1
      ELSE
        PRINT "Necesitas llevar contigo las pilas y la linterna."
      ENDIF
      MATCH
    ENDON

    ON ENCEN LINTE
      IF _PILAS_PUESTAS = 0 THEN
        PRINT "La linterna no se enciende: esta sin pilas."
      ELSE
        IF #linterna.lit THEN
          PRINT "La linterna ya esta encendida."
        ELSE
          LIT #linterna
          PRINT "Enciendes la linterna y un haz de luz brota del cristal."
          ADDSCORE 1
        ENDIF
      ENDIF
      MATCH
    ENDON

    ON EXAMI LINTE
      IF _PILAS_PUESTAS = 0 THEN
        PRINT "Una linterna metalica, algo oxidada. Esta SIN PILAS."
      ELSE
        IF #linterna.lit THEN
          PRINT "Tu linterna, con las pilas puestas y encendida."
        ELSE
          PRINT "Tu linterna, con las pilas puestas pero apagada."
        ENDIF
      ENDIF
      MATCH
    ENDON

    REM -- Paso 3 (final): encender la lampara y salvar el barco --
    ON ENCEN LAMPA
      IF AT @faro THEN
        IF DARK THEN
          PRINT "Esta demasiado oscuro aqui dentro. No distingues la lampara."
          MATCH
        ENDIF
        PRINT "Accionas el viejo mecanismo. Con un zumbido, la gran lampara despierta"
        PRINT "y un haz de luz blanca barre la tormenta."
        PRINT ""
        PRINT "Mar adentro, el barco vira a tiempo y se aleja de las rocas."
        PRINT "El faro vuelve a vivir."
        ADDSCORE 4
        PRINT ""
        PRINT "*** HAS GANADO ***"
        SCORE
        END
      ENDIF
    ENDON
  before_turn: ''
  after_turn: ''
  on_end: ''
