condacts:
  on_start: REM El Faro - aventura de ejemplo de Scriba. Sin temporizadores.
  responses: "REM ===========================================================\nREM\
    \  EL FARO - logica del juego\nREM ===========================================================\n\
    \nON AYUDA _ _\n  PRINT \"------------------------------------------\"\n  PRINT\
    \ \"COMANDOS\"\n  PRINT \"  Mover: NORTE  SUR  (N / S)\"\n  PRINT \"  EXAMINAR\
    \ cosa     CAVAR arena\"\n  PRINT \"  COGER cosa        ABRIR puerta\"\n  PRINT\
    \ \"  METER pilas       ENCENDER linterna\"\n  PRINT \"  ENCENDER lampara  INVENTARIO\
    \ (I)\"\n  PRINT \"  PUNTUACION        SALIR\"\n  PRINT \"------------------------------------------\"\
    \n  MATCH\nENDON\n\nON PUNT _ _\n  SCORE\n  MATCH\nENDON\n\nREM -- Paso 1: descubrir\
    \ la llave cavando/examinando la arena --\nON CAVAR ARENA\n  IF AT @playa THEN\n\
    \    IF _ARENA_CAVADA = 0 THEN\n      LET _ARENA_CAVADA = 1\n      CREATE #llave\
    \ @playa\n      PRINT \"Escarbas en la arena fria y tus dedos rozan algo metalico:\"\
    \n      PRINT \"una llave oxidada queda al descubierto.\"\n      ADDSCORE 3\n\
    \    ELSE\n      PRINT \"Solo queda arena revuelta.\"\n    ENDIF\n    MATCH\n\
    \  ENDIF\nENDON\n\nON EXAMI ARENA\n  IF AT @playa THEN\n    IF _ARENA_CAVADA =\
    \ 0 THEN\n      PRINT \"La arena esta removida por el temporal. Algo asoma a medias;\
    \ tendrias que CAVAR para sacarlo.\"\n    ELSE\n      PRINT \"Solo queda arena\
    \ revuelta.\"\n    ENDIF\n    MATCH\n  ENDIF\nENDON\n\nREM -- Paso 2: abrir la\
    \ puerta del faro con la llave --\nON ABRIR PUERT\n  IF AT @sendero THEN\n   \
    \ IF _PUERTA_ABIERTA = 1 THEN\n      PRINT \"La puerta del faro ya esta abierta.\"\
    \n    ELSE\n      IF CARRIED #llave THEN\n        LET _PUERTA_ABIERTA = 1\n  \
    \      PRINT \"La llave gira con un chirrido oxidado y la puerta de hierro cede.\"\
    \n        PRINT \"El camino hacia el interior del faro queda libre al NORTE.\"\
    \n        ADDSCORE 3\n      ELSE\n        PRINT \"La puerta de hierro esta cerrada\
    \ a cal y canto. Hara falta una llave.\"\n      ENDIF\n    ENDIF\n    MATCH\n\
    \  ENDIF\nENDON\n\nREM -- La puerta cerrada bloquea el paso al norte (hacia el\
    \ faro) --\nON N _ _\n  IF AT @sendero THEN\n    IF _PUERTA_ABIERTA = 0 THEN\n\
    \      PRINT \"La puerta de hierro, cerrada, te corta el paso hacia el faro.\"\
    \n      MATCH\n    ENDIF\n  ENDIF\nENDON\n\nREM -- Paso 2b: pilas + linterna (puzle\
    \ con variables) --\nON METER PILAS LINTE\n  IF _PILAS_PUESTAS THEN\n    PRINT\
    \ \"La linterna ya tiene las pilas puestas.\"\n    MATCH\n  ENDIF\n  IF #pilas.carried\
    \ AND #linterna.carried THEN\n    LET _PILAS_PUESTAS = 1\n    DESTROY #pilas\n\
    \    PRINT \"Abres la tapa de la linterna y encajas las pilas. Un clic.\"\n  \
    \  ADDSCORE 1\n  ELSE\n    PRINT \"Necesitas llevar contigo las pilas y la linterna.\"\
    \n  ENDIF\n  MATCH\nENDON\n\nON ENCEN LINTE\n  IF _PILAS_PUESTAS = 0 THEN\n  \
    \  PRINT \"La linterna no se enciende: esta sin pilas.\"\n  ELSE\n    IF #linterna.lit\
    \ THEN\n      PRINT \"La linterna ya esta encendida.\"\n    ELSE\n      LIT #linterna\n\
    \      PRINT \"Enciendes la linterna y un haz de luz brota del cristal.\"\n  \
    \    ADDSCORE 1\n    ENDIF\n  ENDIF\n  MATCH\nENDON\n\nON EXAMI LINTE\n  IF _PILAS_PUESTAS\
    \ = 0 THEN\n    PRINT \"Una linterna metalica, algo oxidada. Esta SIN PILAS.\"\
    \n  ELSE\n    IF #linterna.lit THEN\n      PRINT \"Tu linterna, con las pilas\
    \ puestas y encendida.\"\n    ELSE\n      PRINT \"Tu linterna, con las pilas puestas\
    \ pero apagada.\"\n    ENDIF\n  ENDIF\n  MATCH\nENDON\n\nREM -- Paso 3 (final):\
    \ encender la lampara y salvar el barco --\nON ENCEN LAMPA\n  IF AT @faro THEN\n\
    \    IF DARK THEN\n      PRINT \"Esta demasiado oscuro aqui dentro. No distingues\
    \ la lampara.\"\n      MATCH\n    ENDIF\n    PRINT \"Accionas el viejo mecanismo.\
    \ Con un zumbido, la gran lampara despierta\"\n    PRINT \"y un haz de luz blanca\
    \ barre la tormenta.\"\n    PRINT \"\"\n    PRINT \"Mar adentro, el barco vira\
    \ a tiempo y se aleja de las rocas.\"\n    PRINT \"El faro vuelve a vivir.\"\n\
    \    ADDSCORE 4\n    PRINT \"\"\n    PRINT \"*** HAS GANADO ***\"\n    SCORE\n\
    \    END\n  ENDIF\nENDON"
  before_turn: ''
  after_turn: ''
  on_end: ''
