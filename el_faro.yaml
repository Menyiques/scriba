metadata:
  title: EL FARO
  author: (tu nombre)
  version: '1.0'
  language: es
  start_location: '@playa'
  max_score: 12
  start_message: 'EL FARO

    Una aventura breve hecha con Scriba.


    Medianoche. La tormenta azota la costa y, mar adentro, las luces de un barco se
    acercan peligrosamente a las rocas. El viejo faro lleva anos apagado. Solo tu
    puedes volver a encenderlo. No hay tiempo que perder.


    Escribe AYUDA si necesitas la lista de comandos.'
