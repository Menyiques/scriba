locations:
  '@playa':
    name: Playa de los Naufragos
    description: |-
      Estas en una playa estrecha y oscura. La lluvia te cala y las olas rompen con furia a tus pies. La arena humeda se hunde bajo tus botas.
      Un sendero trepa hacia el NORTE, hacia la silueta negra del faro.
    dark: false
    exits:
      N: '@sendero'
      S: null
      E: null
      O: null
      U: null
      D: null
    on_enter: []
  '@sendero':
    name: El sendero del acantilado
    description: |-
      Un sendero resbaladizo serpentea por el borde del acantilado. Arriba se alza el faro, enorme y mudo. Una pesada puerta de hierro cierra su entrada al NORTE.
      Abajo, al SUR, vuelve la playa.
    dark: false
    exits:
      N: '@faro'
      S: '@playa'
      E: null
      O: null
      U: null
      D: null
    on_enter: []
  '@faro':
    name: Interior del faro
    description: |-
      Dentro del faro reina el silencio. Una escalera de caracol asciende hasta la gran lampara, apagada desde hace anos, esperando una mano que la despierte.
      Al SUR, la puerta da de nuevo al sendero.
    dark: true
    exits:
      N: null
      S: '@sendero'
      E: null
      O: null
      U: null
      D: null
    on_enter: []
