locations:
  '@playa':
    name: Playa de los Naufragos
    description: 'Estas en una playa estrecha y oscura. La lluvia te cala y las olas
      rompen con furia a tus pies. La arena humeda se hunde bajo tus botas.

      Un sendero trepa hacia el NORTE, hacia la silueta negra del faro.'
    dark: false
    exits:
      N: '@sendero'
      S: null
      E: null
      O: null
      U: null
      D: null
    on_enter: []
  '@sendero':
    name: El sendero del acantilado
    description: 'Un sendero resbaladizo serpentea por el borde del acantilado. Arriba
      se alza el faro, enorme y mudo. Una pesada puerta de hierro cierra su entrada
      al NORTE.

      Abajo, al SUR, vuelve la playa.'
    dark: false
    exits:
      N: '@faro'
      S: '@playa'
      E: null
      O: null
      U: null
      D: null
    on_enter: []
  '@faro':
    name: Interior del faro
    description: 'Dentro del faro reina el silencio. Una escalera de caracol asciende
      hasta la gran lampara, apagada desde hace anos, esperando una mano que la despierte.

      Al SUR, la puerta da de nuevo al sendero.'
    dark: true
    exits:
      N: null
      S: '@sendero'
      E: null
      O: null
      U: null
      D: null
    on_enter: []
objects:
  '#llave':
    name: una llave oxidada
    noun: LLAVE
    description: Una llave de hierro, comida por el salitre. Quiza abra alguna cerradura.
    location: '@NOWHERE'
    initial_message: Medio enterrada en la arena asoma una llave oxidada.
    key: null
    weight: 0
    wearable: false
    container: false
    openable: false
    light_source: false
    lit: false
    open: false
    locked: false
    attributes: []
  '#arena':
    name: la arena de la playa
    noun: ARENA
    description: Arena oscura y humeda, removida por el temporal. Algo podria estar
      enterrado en ella; convendria CAVAR.
    location: '@playa'
    attributes:
    - fixed
  '#puerta':
    name: la puerta del faro
    noun: PUERT
    description: Una pesada puerta de hierro oxidado con una vieja cerradura. Esta
      cerrada.
    location: '@sendero'
    attributes:
    - fixed
  '#lampara':
    name: la lampara del faro
    noun: LAMPA
    description: La gran lampara del faro, de bronce y cristal. Lleva anos apagada;
      solo hay que accionar su mecanismo.
    location: '@faro'
    attributes:
    - fixed
  '#linterna':
    name: una linterna
    noun: LINTE
    description: Una linterna metalica.
    location: '@INVEN'
    weight: 1
    light_source: true
    lit: false
    wearable: false
    container: false
    openable: false
    open: false
    locked: false
    key: null
    attributes: []
  '#pilas':
    name: unas pilas
    noun: PILAS
    description: Un par de pilas gruesas; servirian para una linterna.
    location: '@sendero'
    initial_message: Sobre una roca del sendero hay unas pilas olvidadas.
    weight: 1
    wearable: false
    container: false
    openable: false
    open: false
    locked: false
    light_source: false
    lit: false
    key: null
    attributes: []
