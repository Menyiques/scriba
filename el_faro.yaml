  '#llave':
    name: una llave oxidada
    noun: LLAVE
    description: Una llave de hierro, comida por el salitre. Quiza abra alguna cerradura.
    location: '@NOWHERE'
    initial_message: Medio enterrada en la arena asoma una llave oxidada.
    key: null
